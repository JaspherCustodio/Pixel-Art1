<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaspher Custodio</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #ccc;
        }

        table {
            table-layout: fixed;
            border-collapse: collapse;
        }

        td{
            /* border: 2px solid black; */
            width: 15px;
            height: 15px;
        }
        
        .scene {
            background-color: #224251;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .moon-scene {
            position: relative;
            animation: moon-anim 9s ease-in-out infinite;
        }

        .cloud-light{
            background-color: #5fa1a0;
        }

        .cloud-dark{
            background-color: #3c7376;
        }

        .cloud-darken{
            background-color: #315d68;
        }

        .star-light{
            animation: blink 3s infinite alternate;
            animation-delay: calc(var(--delay) * 1.5s);
        }

        .star-dark{
            animation: shine 3.5s infinite alternate;
            animation-delay: calc(var(--delay) * 1.5s);
        }

        .moon-light{
            background-color: #fafde0;
        }

        .moon-dark{
            background-color: #e0e6aa;
        }

        .moon-darken{
            background-color: #576e74;
        }


        @keyframes moon-anim {
            0%, 100% {
                top: -600px;
            }

            20%, 90% {
                top: 0px;
            }
        }

        @keyframes blink {
            0%, 100% {
                background-color: transparent;
            }

            25%, 75% {
                background-color: #fafde0;
            }
        }

        
        @keyframes shine {
            0%, 25%, 75%, 100% {
                background-color: transparent;
            }

            50% {
                background-color: #5e7279;
            }
        }

        .luffy-jump {
            position: absolute;
            animation: jump 9s ease-in-out infinite;
        }

        .luffy-up {
            animation: jump-color 9s ease-in-out infinite;
        }

        .trail-up{
            animation: jump-trail-color 9s ease-in-out infinite;
        }

        @keyframes jump {
            0%, 10%, 100% {
                top: 600px;
            }

            20%, 90%{
                top: 0px;
            }
        }

        @keyframes jump-color {
            0%, 23% {
                background-color: #18333e;
            }

            23.5%, 100% {
                background-color: transparent;
            }
        }

        @keyframes jump-trail-color {
            0%, 17% {
                background-color: #18333e;
            }

            17.5%, 100% {
                background-color: transparent;
            }
        }

        .luffy-fall {
            position: absolute;
            animation: fall 9s ease-in-out infinite;
        }

        .luffy-down {
            animation: fall-color 9s ease-in-out infinite;
        }

        .trail-down{
            animation: fall-trail-color 9s ease-in-out infinite;
        }

        @keyframes fall {
            0%, 10%, 100% {
                top: 600px;
            }

            20%, 90%{
                top: 0px;
            }
        }

        @keyframes fall-color {
            0%, 23% {
                background-color: transparent;
            }

            23.5%, 100% {
                background-color: #18333e;
            }
        }

        @keyframes fall-trail-color {
            0%, 90% {
                background-color: transparent;
            }

            90.5%, 100% {
                background-color: #18333e;
            }
        }

    </style>
</head>

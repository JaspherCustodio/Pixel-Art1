    <link rel="stylesheet" href="styles.css">
    <style>
        body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #ccc;
        }

        table {
            table-layout: fixed;
            border-collapse: collapse;
        }
        
        .scene {
            background-color: #224251;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .moon-scene {
            position: relative;
            animation: wal 4s steps(36, end) infinite;
        }

        td{
            border: 2px solid black;
            width: 15px;
            height: 15px;
        }

        .cloud-light{
            background-color: #5fa1a0;
        }

        .cloud-dark{
            background-color: #3c7376;
        }

        .cloud-darken{
            background-color: #315d68;
        }

        .star-light{
            background-color: #fafde0;
        }

        .star-dark{
            background-color: #5e7279;
        }

        .moon-light{
            background-color: #fafde0;
        }

        .moon-dark{
            background-color: #e0e6aa;
        }

        .moon-darken{
            background-color: #576e74;
        }


        @keyframes walk {
            0% {
                top: -30px;
            }
            25%{
                top: 480px;
            }
            75%{
                top: 480px;
            }
            100% {
                top: 12px;
            }
        }
    </style>
</head>
